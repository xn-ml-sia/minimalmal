<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    .dot {
      transform-origin: 16px 16px;
      animation: bounce 3.2s linear infinite;
    }
    @keyframes bounce {
      0% { transform: translate(0px, -7.4px); }
      14.29% { transform: translate(7.21px, 1.65px); }
      28.57% { transform: translate(-3.21px, 6.67px); }
      42.86% { transform: translate(-5.79px, -4.61px); }
      57.14% { transform: translate(5.79px, -4.61px); }
      71.43% { transform: translate(3.21px, 6.67px); }
      85.71% { transform: translate(-7.21px, 1.65px); }
      100% { transform: translate(0px, -7.4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; transform: none; }
    }
  </style>
  <circle cx="16" cy="16" r="13.25" stroke="#0A0A0A" stroke-width="1.5"/>
  <circle class="dot" cx="16" cy="16" r="3.35" fill="#0A0A0A"/>
</svg>
